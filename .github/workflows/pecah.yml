name: Deploy Static Article Site to GitHub Pages

on:
  # Menjalankan workflow setiap kali ada push ke branch utama (main/master)
  push:
    branches: [ "main", "master" ]
  
  # Berjalan otomatis setiap 6 jam untuk update RSS
  schedule:
    - cron: '0 */6 * * *'

  # Memungkinkan workflow dijalankan secara manual dari tab Actions
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4

      - name: Run Article Generator Script
        run: |
          # Menjalankan skrip Python utama (pastikan nama file sesuai, misal import.py)
          python import.py

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
