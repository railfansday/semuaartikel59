name: Split and Deploy Large Article Repository

on:
  push:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 */6 * * *'  # Berjalan otomatis setiap 6 jam
  workflow_dispatch:        # Bisa diklik "Run workflow" manual dari GitHub

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  split-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4

      - name: Run Python Script with 200 Pagination Limit
        run: |
          # Pastikan nama file skrip Python utama atau skrip pemecahmu sesuai (misal: import.py atau split.py)
          python import.py

      - name: Check Generated Files (Debug)
        run: |
          ls -la

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
